<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Card Hover Effect | code_wars_official</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-item">
        <a class="card-link" href="#" role="button" aria-pressed="false" aria-label="Show or hide the character">
            <div class="card">
                <div class="wrapper">
                    <img src="./First Cover copy.webp" class="cover-image" />
                </div>
                <img src="./First title.png" class="title" />
                <img src="./First character.webp" class="character" />
            </div>
        </a>
        <a class="card-button" href="https://phu0410.github.io/Book-Porforlio/#" target="_blank">My CV :3</a>
    </div>
    <script>
        // design by chatgpt: toggle the character on each tap on phones while leaving desktop hover unchanged.
        const cardLink = document.querySelector('.card-link');
        const card = cardLink.querySelector('.card');
        const mobileCardToggle = window.matchMedia('(max-width: 600px), (pointer: coarse)');
        let lastPointerType = '';

        document.addEventListener('pointerdown', (event) => {
            lastPointerType = event.pointerType;
        });

        document.addEventListener('click', (event) => {
            const isTouchInput = lastPointerType === 'touch' || mobileCardToggle.matches;
            const clickedElement = event.target instanceof Element ? event.target : null;
            const cardTapped = clickedElement?.closest('.card-link') === cardLink;

            if (isTouchInput && cardTapped) {
                event.preventDefault();
                card.classList.toggle('is-active');
            } else if (isTouchInput && !clickedElement?.closest('.card-button')) {
                // chatgpt design: tapping the white area outside the card closes the character on touch devices.
                card.classList.remove('is-active');
            }

            cardLink.setAttribute('aria-pressed', String(card.classList.contains('is-active')));
            lastPointerType = '';
        });
    </script>
</body>
</html>
